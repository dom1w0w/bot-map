<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#04060d">
<title>Live Bot Map</title>
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="stars"></canvas><div class="vignette"></div>
<header>
  <h1>Bot Map <span>/ Dom</span></h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search bots…" aria-label="Search bots">
    <select id="cluster" aria-label="Cluster filter"><option value="">All clusters</option></select>
    <a class="btn" href="list.html" data-keep>☰ List</a>
    <span class="live" id="live"><i></i>LOADING</span>
  </div>
</header>
<svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
<div class="err" id="msg"></div>
<div id="tip"></div>
<div class="legend"><span class="p"><i></i>Active &lt;10 min</span><span class="g"><i></i>Active &lt;24h</span><span class="d"><i></i>Quiet</span><span>Size = 24h activity</span></div>
<div class="ticker" id="ticker"></div>
<script src="config.js"></script><script src="common.js"></script><script src="stars.js"></script><script src="map.js"></script>
</body></html>
